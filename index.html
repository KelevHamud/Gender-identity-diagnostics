<!DOCTYPE html>
<html lang="ru">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta charset="UTF-8">
    <title>BSRI: Психодиагностика</title>
  <style>
    :root { 
        --bg: #F5F5F7; 
        --text: #1D1D1F; 
        --accent: #0071E3; 
        --card: #FFFFFF; 
    }

    body { 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        background-color: var(--bg); 
        color: var(--text); 
        margin: 0; 
        padding: 20px; /* Уменьшили отступы для мобильных */
        display: flex; 
        justify-content: center; 
        align-items: flex-start; 
        min-height: 100vh;
        transition: background-color 0.6s ease; 
    }

    .container { 
        width: 100%; 
        max-width: 550px; /* Ограничение для ПК */
        margin-top: 20px;
    }

    .card { 
        background: var(--card); 
        padding: 30px 20px; 
        border-radius: 24px; 
        box-shadow: 0 10px 30px rgba(0,0,0,0.06); 
        text-align: center; 
        box-sizing: border-box; /* Чтобы падинги не раздували карточку */
    }

    .question-text { 
        font-size: 24px; /* Оптимально для всех устройств */
        font-weight: 600; 
        margin: 30px 0; 
        min-height: 80px; 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        line-height: 1.3; 
    }

    /* Контейнер для кнопок: на мобильных в ряд, если помещаются */
    #buttons {
        display: flex;
        flex-direction: row;
        gap: 10px;
        justify-content: center;
    }

    button { 
        flex: 1; /* Кнопки одинаковой ширины */
        max-width: 200px;
        padding: 16px 20px; 
        border-radius: 14px; /* Более современный скругленный квадрат */
        border: none; 
        font-weight: 600; 
        cursor: pointer; 
        font-size: 17px; 
        transition: transform 0.1s active; 
        -webkit-tap-highlight-color: transparent; /* Убирает синюю рамку при нажатии на iOS */
    }

    .main-btn { background: var(--accent); color: white; }
    .no { background: #E5E5EA; color: #3A3A3C; }

    .analysis-box { 
        text-align: left; 
        background: rgba(0,0,0,0.03); 
        padding: 20px; 
        border-radius: 18px; 
        margin-top: 15px; 
        font-size: 15px;
        line-height: 1.6; 
    }

    .hidden { display: none !important; }

    .badge { 
        display: inline-block; 
        padding: 6px 12px; 
        border-radius: 8px; 
        font-size: 13px; 
        font-weight: 700; 
        margin-bottom: 10px; 
        color: white; 
    }

    /* АДАПТАЦИЯ ПОД ТЕЛЕФОНЫ (Экран меньше 480px) */
    @media (max-width: 480px) {
        body { padding: 10px; }
        .card { padding: 25px 15px; border-radius: 20px; }
        .question-text { font-size: 20px; margin: 20px 0; }
        button { padding: 14px 10px; font-size: 16px; }
        h1 { font-size: 22px; }
        #buttons { flex-direction: column; } /* Кнопки "Да/Нет" друг под другом на очень узких экранах */
        button { max-width: none; width: 100%; }
    }
</style>
</head>
<body>

<div class="container">
    <div class="card" id="start">
        <h1>BSRI Psychometrics</h1>
        <p>Выберите пол для калибровки нормативной модели и склонения вопросов:</p>
        <button class="main-btn" style="background:#0071E3;" onclick="startQuiz('male')">Мужчина</button>
        <button class="main-btn" style="background:#D81B60;" onclick="startQuiz('female')">Женщина</button>
    </div>

    <div class="card hidden" id="quiz">
        <div id="q-text" class="question-text"></div>
        <div id="buttons">
            <button class="no" onclick="answer(0)">Нет</button>
            <button class="main-btn" onclick="answer(1)">Да</button>
        </div>
    </div>

    <div class="card hidden" id="result">
        <div id="report-text"></div>
        <button class="main-btn" style="width:100%; margin-top:30px;" onclick="location.reload()">Начать заново</button>
    </div>
</div>

<script>
    const items = [
        {t: "Самостоятельный", f: "Самостоятельная", type: "M"}, {t: "Ласковый", f: "Ласковая", type: "F"}, {t: "Аккуратный", f: "Аккуратная", type: "N"},
        {t: "Амбициозный", f: "Амбициозная", type: "M"}, {t: "Чувствительный", f: "Чувствительная", type: "F"}, {t: "Надежный", f: "Надежная", type: "N"},
        {t: "Аналитичный", f: "Аналитичная", type: "M"}, {t: "Заботливый", f: "Заботливая", type: "F"}, {t: "Веселый", f: "Веселая", type: "N"},
        {t: "Напористый", f: "Напористая", type: "M"}, {t: "Мягкий", f: "Мягкая", type: "F"}, {t: "Скромный", f: "Скромная", type: "N"},
        {t: "Конкурентный", f: "Конкурентная", type: "M"}, {t: "Эмпатичный", f: "Эмпатичная", type: "F"}, {t: "Искренний", f: "Искренняя", type: "N"},
        {t: "Решительный", f: "Решительная", type: "M"}, {t: "Миролюбивый", f: "Миролюбивая", type: "F"}, {t: "Пунктуальный", f: "Пунктуальная", type: "N"},
        {t: "Доминирующий", f: "Доминирующая", type: "M"}, {t: "Нежный", f: "Нежная", type: "F"}, {t: "Сдержанный", f: "Сдержанная", type: "N"},
        {t: "Лидер", f: "Лидер", type: "M"}, {t: "Сердечный", f: "Сердечная", type: "F"}, {t: "Дружелюбный", f: "Дружелюбная", type: "N"},
        {t: "Сильный", f: "Сильная", type: "M"}, {t: "Доверчивый", f: "Доверчивая", type: "F"}, {t: "Оптимистичный", f: "Оптимистичная", type: "N"},
        {t: "Независимый", f: "Независимая", type: "M"}, {t: "Понимающий", f: "Понимающая", type: "F"}, {t: "Любопытный", f: "Любопытная", type: "N"},
        {t: "Агрессивный", f: "Агрессивная", type: "M"}, {t: "Уступчивый", f: "Уступчивая", type: "F"}, {t: "Терпеливый", f: "Терпеливая", type: "N"},
        {t: "Мужественный", f: "Мужественная", type: "M"}, {t: "Женственный", f: "Женственная", type: "F"}, {t: "Честный", f: "Честная", type: "N"},
        {t: "Деловой", f: "Деловая", type: "M"}, {t: "Эмоциональный", f: "Эмоциональная", type: "F"}, {t: "Спокойный", f: "Спокойная", type: "N"},
        {t: "Смелый", f: "Смелая", type: "M"}, {t: "Милосердный", f: "Милосердная", type: "F"}, {t: "Внимательный", f: "Внимательная", type: "N"},
        {t: "Самодостаточный", f: "Самодостаточная", type: "M"}, {t: "Скромный", f: "Скромная", type: "F"}, {t: "Творческий", f: "Творческая", type: "N"},
        {t: "Рациональный", f: "Рациональная", type: "M"}, {t: "Сопереживающий", f: "Сопереживающая", type: "F"}, {t: "Ответственный", f: "Ответственная", type: "N"},
        {t: "Склонный к риску", f: "Склонная к риску", type: "M"}, {t: "Теплый", f: "Теплая", type: "F"}, {t: "Застенчивый", f: "Застенчивая", type: "N"},
        {t: "Уверенный", f: "Уверенная", type: "M"}, {t: "Чувственный", f: "Чувственная", type: "F"}, {t: "Талантливый", f: "Талантливая", type: "N"},
        {t: "Индивидуалист", f: "Индивидуалистка", type: "M"}, {t: "Домашний", f: "Домашняя", type: "F"}, {t: "Упрямый", f: "Упрямая", type: "N"},
        {t: "Настойчивый", f: "Настойчивая", type: "M"}, {t: "Покладистый", f: "Покладистая", type: "F"}, {t: "Загадочный", f: "Загадочная", type: "N"}
    ];

    let current = 0, mScore = 0, fScore = 0, nScore = 0, userGender = "";

    function startQuiz(gender) {
        userGender = gender;
        const root = document.documentElement;
        if (gender === 'male') {
            root.style.setProperty('--bg', '#E0E8F0');
            root.style.setProperty('--accent', '#0071E3');
        } else {
            root.style.setProperty('--bg', '#FCE4EC');
            root.style.setProperty('--accent', '#D81B60');
        }
        document.getElementById('start').classList.add('hidden');
        document.getElementById('quiz').classList.remove('hidden');
        showQ();
    }

    function showQ() {
        document.getElementById('q-text').innerText = (userGender === 'female') ? items[current].f : items[current].t;
    }

    function answer(val) {
        if(val === 1) {
            if(items[current].type === 'M') mScore++;
            if(items[current].type === 'F') fScore++;
            if(items[current].type === 'N') nScore++;
        }
        current++;
        current < items.length ? showQ() : finish();
    }

    function finish() {
        document.getElementById('quiz').classList.add('hidden');
        document.getElementById('result').classList.remove('hidden');
        document.getElementById('report-text').innerHTML = `
            <h2>Аналитический отчет</h2>
            <div class="analysis-box">
                <b>Баллы:</b> М: ${mScore}/20 | Ф: ${fScore}/20 | А: ${nScore}/20
            </div>
            <div class="analysis-box">${generateDeepAnalysis()}</div>`;
    }

    function generateDeepAnalysis() {
        let report = "";
        const isMale = userGender === 'male';
        
        // Определяем психологический статус
        let status = "";
        let color = "";
        if (mScore >= 12 && fScore >= 12) { status = "Андрогинность (Высокая адаптивность)"; color = "#673AB7"; }
        else if (mScore > fScore) { status = "Маскулинный тип"; color = "#0071E3"; }
        else if (fScore > mScore) { status = "Фемининный тип"; color = "#D81B60"; }
        else { status = "Недифференцированный тип"; color = "#6c757d"; }

        report += `<span class="badge" style="background:${color}">${status}</span>`;

        // Блок глубокой аналитики
        if (isMale && fScore > mScore) {
            // Специфика для мужчин с преобладанием фемининности
            report += `
                <div style="margin-top:15px;">
                    <b>Психологический вектор:</b> Ваш профиль указывает на высокую чувствительность и развитый эмоциональный интеллект. В современной среде это преимущество, однако для баланса важно проработать аспекты <b>Анимуса (внутренней опоры)</b>.
                </div>
                <div style="background: rgba(0,113,227,0.05); padding: 15px; border-radius: 15px; margin-top: 15px;">
                    <b>Зоны проработки:</b>
                    <ul>
                        <li><b>Ассертивность вместо конформности:</b> Если высокие баллы по "уступчивости" и "мягкости" мешают вашим целям, начните практиковать отказ без объяснения причин.</li>
                        <li><b>Принятие риска:</b> В ситуациях неопределенности делайте выбор в пользу действия, даже если нет 100% гарантии успеха. Это укрепляет "волю к достижению".</li>
                        <li><b>Границы:</b> Проработайте навык защиты личного пространства. Ваша "заботливость" не должна превращаться в обслуживание интересов других в ущерб себе.</li>
                    </ul>
                </div>`;
        } else if (!isMale && mScore > fScore) {
            // Специфика для женщин с преобладанием маскулинности
            report += `
                <div style="margin-top:15px;">
                    <b>Психологический вектор:</b> Вы обладаете сильным лидерским потенциалом и ориентацией на результат. Важно проработать контакт с <b>Анимой (ресурсным состоянием)</b>, чтобы избежать выгорания.
                </div>
                <div style="background: rgba(216,27,96,0.05); padding: 15px; border-radius: 15px; margin-top: 15px;">
                    <b>Зоны проработки:</b>
                    <ul>
                        <li><b>Делегирование контроля:</b> Попробуйте передавать ответственность, не проверяя промежуточные этапы. Это снизит уровень фоновой тревоги.</li>
                        <li><b>Эмоциональная экспрессия:</b> Разрешите себе проявлять уязвимость в близком кругу. Это укрепляет доверие глубже, чем постоянная "непоколебимость".</li>
                        <li><b>Созерцательность:</b> Учитесь находиться в моменте "бытия", а не постоянного "делания".</li>
                    </ul>
                </div>`;
        } else if (mScore >= 12 && fScore >= 12) {
            // Андрогинность (общий совет)
            report += `
                <div style="margin-top:15px;">
                    <b>Психологический вектор:</b> Вы — "универсальный игрок". Вы умеете использовать разные стратегии поведения.
                </div>
                <div style="background: rgba(103,58,183,0.05); padding: 15px; border-radius: 15px; margin-top: 15px;">
                    <b>Рекомендация:</b> Главный вызов для вас — своевременность. Отслеживайте, не включаете ли вы "доминирование" там, где нужна "эмпатия", и наоборот. Ваша сила в осознанном переключении режимов.
                </div>`;
        } else {
            // Низкие баллы по обоим шкалам
            report += `<p style="margin-top:15px;">Ваш профиль предполагает поиск новых опор. Рекомендуется начать с развития базовых качеств уверенности и навыков понимания своих чувств.</p>`;
        }
// Расчет индекса IS (Gender Schema)
    // Индекс показывает дистанцию между шкалами. Чем ближе к 0, тем выше андрогинность.
    let diff = Math.abs(mScore - fScore);
    let schemaStatus = "";
    let schemaDesc = "";

    if (diff <= 2) {
        schemaStatus = "Минимальная (Свобода от стереотипов)";
        schemaDesc = "Вы не делите мир на 'мужское' и 'женское'. Ваше поведение диктуется ситуацией, а не социальными ожиданиями.";
    } else if (diff > 2 && diff <= 5) {
        schemaStatus = "Умеренная";
        schemaDesc = "У вас есть склонность придерживаться определенной гендерной роли, но вы сохраняете пространство для маневра.";
    } else {
        schemaStatus = "Высокая (Гендерная зажатость)";
        schemaDesc = "Вы сильно опираетесь на традиционные модели поведения. Это дает определенность, но может ограничивать вашу эмоциональную и деловую гибкость.";
    }

    // Добавляем этот блок в итоговый отчет
    report += `
        <div style="margin-top: 20px; border-top: 1px solid #ddd; pt-15px;">
            <h4 style="margin-bottom:10px;">Индекс гендерной схематизации (по С. Бем)</h4>
            <div style="background: #fff; border: 1px solid #eee; padding: 15px; border-radius: 12px;">
                <span class="badge" style="background: #444; color: #fff; font-size: 12px;">Уровень схематизации: ${schemaStatus}</span>
                <p style="font-size: 14px; margin-top: 10px; color: #444;">${schemaDesc}</p>
            </div>
        </div>
    `;
        return report;
    }
</script>
</body>
</html>
